apply from: rootProject.file("versions.gradle")

tasks.register('printc') {
	configurations.each { if (it.isCanBeResolved()) println it.name }
}

android {
    compileSdk libs.versions.osmand.compileSdk.get().toInteger()
    buildToolsVersion = libs.versions.osmand.buildTools.get()
    // compileNdkVersion "android-ndk-r17b"
    namespace = "net.osmand.plus"
    defaultConfig {
        targetSdkVersion libs.versions.osmand.targetSdk.get().toInteger()
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

	lintOptions {
		abortOnError false
	}

	// related to kuromoji
	//packagingOptions {
	//	exclude '/META-INF/CONTRIBUTORS.md'
	//	exclude '/META-INF/LICENSE.md'
	//	exclude '/META-INF/NOTICE.md'
	//}

	// This is from OsmAndCore_android.aar - for some reason it's not inherited
	aaptOptions {
		// Don't compress any embedded resources
		noCompress "qz"
		cruncherEnabled = false
		// Flag notifies aapt to keep the attribute IDs around
		// additionalParameters "--no-version-vectors"
	}

	testOptions {
		animationsDisabled = true
	}

	sourceSets {
		main {
			manifest.srcFile "AndroidManifest.xml"
			jni.srcDirs = []
			jniLibs.srcDirs = ["libs"]
			aidl.srcDirs = ["src"]
			java.srcDirs = ["src"]
			resources.srcDirs = ["src"]
			res.srcDirs = ["res", layout.buildDirectory.dir("generated/osmand/res")]
			assets.srcDirs = ["assets", layout.buildDirectory.dir("generated/osmand/assets")]
		}
		androidTest {
			java.srcDirs = ["test/java"]
			res.srcDirs = ["test/res"]
			assets.srcDirs = ["test/assets"]
		}
		legacy {
			jniLibs.srcDirs = ["libc++"]
		}
	}

	flavorDimensions "coreversion", "abi"
	productFlavors {
		// ABI
		armv7 {
			dimension "abi"
			ndk {
				abiFilter 'armeabi-v7a'
			}
		}
		arm64 {
			dimension "abi"
			ndk {
				abiFilter 'arm64-v8a'
			}
		}
		x86 {
			dimension "abi"
			ndk {
				abiFilters 'x86', 'x86_64'
			}
		}
		armonly {
			dimension "abi"
			ndk {
				//noinspection ChromeOsAbiSupport
				abiFilters 'arm64-v8a', 'armeabi-v7a'
			}
		}
		fat {
			dimension "abi"
			ndk {
				abiFilters 'arm64-v8a', 'x86', 'x86_64', 'armeabi-v7a'
			}
		}

		// CoreVersion
		// Build that doesn't include 3D OpenGL
		legacy {
			dimension "coreversion"
		}
	}

	buildTypes {
		debug {
			debuggable true
		}
		release {
			debuggable false
		}
	}
}

